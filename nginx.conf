server {
    listen 80;
    server_name _;

    location = /up {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
